name: adguardhome
services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    hostname: adguardhome
    ports:
      - ${ENV_SERVER_IP}:53:53/tcp
      - ${ENV_SERVER_IP}:53:53/udp
      - 67:67/udp
      - 68:68/tcp
      - 68:68/udp
      - 853:853/tcp
      - 3000:3000/tcp
    volumes:
      - type: bind
        source: ${HOME}/ContainerDBs/adguard/workdir
        target: /opt/adguardhome/work
      - type: bind
        source: ${HOME}/ContainerDBs/adguard/confdir
        target: /opt/adguardhome/conf
    restart: unless-stopped
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Europe/London
    networks:
      - proxy_network
networks:
  proxy_network:
    external: true
