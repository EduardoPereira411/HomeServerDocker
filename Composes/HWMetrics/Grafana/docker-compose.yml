name: grafana
services:
  grafana:
    image: grafana/grafana-oss:12.3.1-ubuntu
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - proxy_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2gb
        reservations:
          memory: 256mb
volumes:
  grafana_data:
networks:
  proxy_network:
    external: true
