name: jellyfin
services:
  jellyfin:
    cpu_shares: 90
    command: []
    container_name: jellyfin
    deploy:
      resources:
        limits:
          memory: 23916M
        reservations:
          memory: "268435456"
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Etc/UTC
    hostname: jellyfin
    image: linuxserver/jellyfin:10.11.10
    labels:
      icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Jellyfin/icon.png
    ports:
      - target: 8096
        published: "8097"
        protocol: tcp
      - target: 8920
        published: "8921"
        protocol: tcp
      - target: 7359
        published: "7359"
        protocol: tcp
      - target: 1900
        published: "1901"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${HOME}/ContainerDBs/jellyfin/config
        target: /config
      - type: bind
        source: ${HOME}/Media
        target: /Media
      - type: bind
        source: /opt/vc/lib
        target: /opt/vc/lib
    cap_add: []
    privileged: false
    networks:
      - proxy_network
networks:
  proxy_network:
    external: true
