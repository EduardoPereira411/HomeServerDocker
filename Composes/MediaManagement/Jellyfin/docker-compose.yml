name: jellyfin

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.1ubu2604-ls50
    container_name: jellyfin
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${HOME}/ContainerDBs/jellyfin/config:/config
      - ${HOME}/Media:/Media
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
